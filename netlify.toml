[build]
  functions = "netlify/functions"

# Every function loads the server-only tour table (prices, capacities, operators) through _shared.js.
# (guide-download never touches it: the table loads lazily, on first use.)
[functions]
  included_files = ["data/operators.json"]

# The shop bot validates every model pick against the shop catalog, so the catalog ships with it.
[functions."shop-bot"]
  included_files = ["shop-catalog.json", "data/operators.json"]

# Gift finder checks every returned handle against the same catalog.
[functions."gift-finder"]
  included_files = ["shop-catalog.json", "data/operators.json", "data/market.json"]

# The three guides answer only from the search index and market config.
[functions."guide"]
  included_files = ["search-index.json", "data/market.json", "data/operators.json", "content/guides/**"]

# ShoreList Direct (physical goods): the catalog is read by the checkout, the order page and the fulfillment code.
[functions."create-goods-checkout"]
  included_files = ["dropship-catalog.json"]
[functions."get-goods-session"]
  included_files = ["dropship-catalog.json"]
[functions."stripe-webhook"]
  included_files = ["dropship-catalog.json", "data/operators.json"]
[functions."sync-supplier-orders"]
  included_files = ["dropship-catalog.json"]
  schedule = "@hourly"
[functions."check-supplier-drift"]
  included_files = ["dropship-catalog.json"]
  schedule = "@daily"

# The paid PDF guides are bundled into the guide-download function only.
[functions."guide-download"]
  included_files = ["netlify/guides-private/**"]

# The site publishes the repo root, so block everything under /netlify/ (the
# private PDFs and function source) from the public web. Must stay first, and forced.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# data/ holds server-only fields (capacities, payout ids); the browser reads /operators-public.json instead.
[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true

# ShoreList Direct: the goods catalog holds supplier and cost data. Never serve it publicly.
[[redirects]]
  from = "/dropship-catalog.json"
  to = "/404.html"
  status = 404
  force = true

# Shopify hosts checkout. These addresses are the ShoreList product pages.
[[redirects]]
  from = "/products/:handle"
  to = "/shop/products/:handle"
  status = 301

