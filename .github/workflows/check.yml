name: site-check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save puppeteer@23.11.1
      - run: node tools/check-card-height.mjs
      - run: node tools/check-site.mjs
      - run: node tools/test-product-pages.mjs
      - run: node tools/test-goods-checkout.cjs
      - run: node tools/check-keywords.mjs
      - run: node tools/thin-content-gate.mjs --site . --entities tools/local-entities.json --warn-only
      - run: node --test tools/feeds/feeds.test.mjs
      - run: node --test tools/indexnow-ping.test.mjs
      - run: node --test tools/test-gift-finder.cjs
      - run: node --test tools/test-guide.cjs
  speed:
    # Mobile Lighthouse budget on the homepage, shop, events and a category page: a speed or accessibility regression fails the PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/lighthouse-budget.mjs
