name: Beach Essentials preview Lighthouse

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - 'shop/beach-day-essentials.html'
      - '.github/workflows/shorelist-essentials-lighthouse-preview.yml'

permissions:
  contents: read

jobs:
  exact-beach-preview:
    if: >-
      github.repository == 'ShoreList/ShoreList' &&
      github.event.pull_request.number == 428 &&
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/beach-day-essentials'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      REVIEWED_HTML_SHA256: dbca5ee9119b33fd6ec5c47c3f01fde96ed02d0aa1a2fdb66f9c994ed3edb153
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PREVIEW_URL: https://deploy-preview-428--stellular-yeot-4f4d8a.netlify.app/shop/beach-day-essentials
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact preview and measure one mobile Lighthouse run
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          CHROME_PATH=$(command -v google-chrome)
          export CHROME_PATH
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version
          qa=$(mktemp -d "$RUNNER_TEMP/shorelist-beach-lh.XXXXXX")
          export qa
          cat > "$qa/bind.cjs" <<'JS'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const [capture, stamp] = process.argv.slice(2);
          const source = fs.readFileSync('shop/beach-day-essentials.html');
          const hosted = fs.readFileSync(capture);
          const digest = crypto.createHash('sha256').update(source).digest('hex');
          assert.equal(digest, process.env.REVIEWED_HTML_SHA256, 'unreviewed checkout page');
          assert(hosted.subarray(0, source.length).equals(source), 'stale/wrong hosted page; wait for exact preview');
          const suffix = hosted.subarray(source.length).toString('utf8').trim();
          const inspector = /^<div data-netlify-deploy-id="([a-f0-9]{24})" data-netlify-site-id="[a-f0-9-]{36}" data-vcs="github" style="position:fixed">\s*<!-- This div is automatically inserted by Netlify for all Deploy Preview URLs\. -->\s*<script async src="\/\.netlify\/scripts\/cdp"><\/script>\s*<\/div>$/;
          const deployment = suffix.match(inspector)?.[1];
          assert(deployment, 'could not independently bind exact Netlify deploy ID');
          fs.writeFileSync(stamp, deployment);
          console.log('Exact Lighthouse fixture', JSON.stringify({head: process.env.EXPECTED_HEAD, sha256: digest, deployment}));
          JS
          preview_capture() {
            local out="$1"
            local status
            status=$(curl --fail-with-body --silent --show-error --proto '=https' --max-time 20 \
              --dump-header "$qa/$out.headers" --output "$qa/$out.html" --write-out '%{http_code}' "$PREVIEW_URL")
            test "$status" = 200
            grep -qiE '^x-robots-tag:[[:space:]]*noindex[[:space:]]*$' "$qa/$out.headers"
            node "$qa/bind.cjs" "$qa/$out.html" "$qa/$out.deploy"
          }
          preview_capture before
          # Same registry dependency/mobile Lighthouse flags as the existing site-check speed job.
          timeout 150s npx --yes lighthouse@12 "$PREVIEW_URL" \
            --only-categories=performance,accessibility,best-practices,seo \
            --form-factor=mobile --output=json --output-path="$qa/report.json" \
            '--chrome-flags=--headless=new --no-sandbox --disable-gpu' --quiet
          preview_capture after
          cmp "$qa/before.deploy" "$qa/after.deploy"
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const j = JSON.parse(fs.readFileSync(process.env.qa + '/report.json', 'utf8'));
          assert.equal(j.requestedUrl, process.env.PREVIEW_URL);
          assert.equal(j.finalDisplayedUrl ?? j.finalUrl, process.env.PREVIEW_URL);
          assert.equal(j.configSettings.formFactor, 'mobile');
          assert.equal(j.configSettings.throttlingMethod, 'simulate');
          assert.match(j.lighthouseVersion, /^12\./);
          assert(!j.runtimeError, JSON.stringify(j.runtimeError));
          const floors = { performance: 90, accessibility: 96, 'best-practices': 90, seo: 90 };
          const score = (category) => {
            const raw = j.categories?.[category]?.score;
            assert(Number.isFinite(raw) && raw >= 0 && raw <= 1, 'missing/non-numeric ' + category);
            return Math.round(raw * 100);
          };
          const scores = Object.fromEntries(Object.keys(floors).map((c) => [c, score(c)]));
          const cls = j.audits?.['cumulative-layout-shift']?.numericValue;
          assert(Number.isFinite(cls) && cls >= 0, 'missing/non-numeric CLS');
          const lcpMs = j.audits?.['largest-contentful-paint']?.numericValue;
          const tbtMs = j.audits?.['total-blocking-time']?.numericValue;
          const failedA11y = j.categories.accessibility.auditRefs.filter((r) => j.audits[r.id]?.score === 0).map((r) => r.id);
          console.log('Touched route mobile Lighthouse', JSON.stringify({
            url: j.finalDisplayedUrl ?? j.finalUrl, lighthouse: j.lighthouseVersion,
            configuration: j.configSettings.formFactor + '/' + j.configSettings.throttlingMethod,
            scores, cls, lcpMs, tbtMs, failedA11y, runWarnings: j.runWarnings || [],
            previewIndexing: j.audits?.['is-crawlable']?.score, fetchTime: j.fetchTime
          }));
          const failures = Object.keys(floors).filter((c) => scores[c] < floors[c]);
          if (cls > 0.1) failures.push('CLS');
          assert.equal(failures.length, 0, 'release floors not met: ' + failures.join(', '));
          JS
