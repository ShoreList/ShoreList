<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Privacy Policy & Terms of Service — ShoreList</title>
<meta name="description" content="ShoreList Privacy Policy and Terms of Service. How we collect, use, and protect your information."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --teal:#0A4D5C;--teal2:#1A7585;--teal3:#073D4A;
  --coral:#E96645;--coral2:#F07A5A;
  --cream:#F5E8CB;--cream2:#FEFCF7;
  --dark:#0D1F25;--mid:#2C4A52;
  --border:rgba(10,77,92,0.10);
}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--cream2);color:var(--dark);overflow-x:hidden;}
nav{position:fixed;top:0;left:0;right:0;z-index:200;padding:18px 48px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,77,92,0.97);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.06);}
.nav-logo{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--cream2);text-decoration:none;font-weight:700;}
.nav-logo span{color:var(--coral);}
.nav-back{font-size:0.82rem;font-weight:600;color:rgba(245,232,203,0.6);text-decoration:none;letter-spacing:0.08em;text-transform:uppercase;transition:color 0.2s;}
.nav-back:hover{color:var(--cream);}
.hero{background:var(--teal3);padding:120px 48px 64px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 80% 50%,rgba(233,102,69,0.07) 0%,transparent 60%);}
.hero::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.03) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;}
.hero-inner{max-width:860px;margin:0 auto;position:relative;z-index:1;}
.hero-tag{font-size:0.70rem;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:var(--coral);margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.hero-tag::before{content:'';width:22px;height:1px;background:var(--coral);}
.hero-title{font-family:'Playfair Display',serif;font-size:clamp(2rem,4vw,3rem);font-weight:900;color:var(--cream2);line-height:1.08;margin-bottom:16px;}
.hero-title em{color:var(--coral);font-style:italic;}
.hero-sub{font-size:0.95rem;color:rgba(245,232,203,0.65);line-height:1.85;max-width:560px;margin-bottom:28px;}
.hero-meta{display:flex;gap:10px;flex-wrap:wrap;}
.hero-badge{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:100px;padding:6px 14px;font-size:0.75rem;font-weight:600;color:rgba(245,232,203,0.75);}
.toc-bar{background:var(--teal);border-bottom:1px solid rgba(255,255,255,0.06);padding:0;overflow-x:auto;}
.toc-inner{max-width:860px;margin:0 auto;display:flex;gap:0;}
.toc-link{font-size:0.72rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(245,232,203,0.65);text-decoration:none;padding:14px 20px;white-space:nowrap;border-bottom:2px solid transparent;transition:all 0.2s;}
.toc-link:hover{color:var(--cream);border-bottom-color:var(--coral);}
.main{max-width:860px;margin:0 auto;padding:60px 48px 100px;}
.doc-section{margin-bottom:56px;padding-bottom:56px;border-bottom:1px solid var(--border);}
.doc-section:last-child{border-bottom:none;}
.sec-eyebrow{font-size:0.68rem;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:var(--coral);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.sec-eyebrow::before{content:'';width:18px;height:1px;background:var(--coral);}
.sec-title{font-family:'Playfair Display',serif;font-size:1.75rem;font-weight:900;color:var(--teal);line-height:1.1;margin-bottom:18px;}
.sec-title em{color:var(--coral);font-style:italic;}
.sec-updated{font-size:0.75rem;color:#6b8a95;margin-bottom:28px;}
.prose p{font-size:0.93rem;color:var(--mid);line-height:1.90;margin-bottom:18px;}
.prose p strong{color:var(--teal3);font-weight:700;}
.prose h3{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;color:var(--teal);margin:32px 0 12px;}
.prose h4{font-size:0.85rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--teal2);margin:24px 0 10px;}
.prose ul{margin:0 0 18px 0;padding-left:0;list-style:none;}
.prose ul li{font-size:0.93rem;color:var(--mid);line-height:1.80;margin-bottom:8px;padding-left:22px;position:relative;}
.prose ul li::before{content:'→';position:absolute;left:0;color:var(--coral);font-weight:700;font-size:0.80rem;}
.prose a{color:var(--teal2);text-decoration:underline;text-decoration-color:rgba(26,117,133,0.35);transition:all 0.2s;}
.prose a:hover{color:var(--coral);text-decoration-color:var(--coral);}
.data-table{width:100%;border-collapse:collapse;margin:24px 0 28px;font-size:0.88rem;}
.data-table th{background:var(--teal);color:var(--cream2);font-weight:700;font-size:0.72rem;letter-spacing:0.10em;text-transform:uppercase;padding:10px 14px;text-align:left;}
.data-table td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--mid);vertical-align:top;line-height:1.65;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:nth-child(even) td{background:rgba(10,77,92,0.03);}
.highlight{background:linear-gradient(135deg,rgba(10,77,92,0.06) 0%,rgba(10,77,92,0.03) 100%);border:1px solid rgba(10,77,92,0.12);border-left:4px solid var(--teal);border-radius:0 8px 8px 0;padding:18px 20px;margin:24px 0;font-size:0.90rem;color:var(--mid);line-height:1.80;}
.highlight strong{color:var(--teal3);font-weight:700;}
.highlight.coral{border-left-color:var(--coral);background:rgba(233,102,69,0.05);border-color:rgba(233,102,69,0.15);}
.highlight.coral strong{color:var(--coral);}
.contact-card{background:var(--teal);border-radius:12px;padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-top:40px;}
.cc-title{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:900;color:var(--cream2);margin-bottom:6px;}
.cc-sub{font-size:0.85rem;color:rgba(245,232,203,0.75);line-height:1.65;}
.cc-links{display:flex;flex-direction:column;gap:6px;}
.cc-link{font-size:0.85rem;font-weight:600;color:var(--coral);text-decoration:none;}
.cc-link:hover{text-decoration:underline;}
footer{background:#0b1a1f;padding:32px 48px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;border-top:1px solid rgba(255,255,255,0.05);}
.foot-logo{font-size:1.2rem;font-weight:900;display:flex;align-items:baseline;text-decoration:none;}
.foot-s{font-family:'Playfair Display',serif;font-style:italic;color:var(--cream);}
.foot-l{font-weight:700;color:var(--coral);}
.foot-copy{font-size:0.76rem;color:rgba(245,232,203,0.45);}
.foot-links{display:flex;gap:20px;flex-wrap:wrap;}
.foot-links a{font-size:0.76rem;color:rgba(245,232,203,0.45);text-decoration:none;transition:color 0.2s;}
.foot-links a:hover{color:var(--coral);}
.foot-links a.active{color:var(--coral);}
@media(max-width:768px){
  nav{padding:16px 20px;}
  .hero{padding:90px 20px 48px;}
  .main{padding:40px 20px 80px;}
  .contact-card{flex-direction:column;}
  footer{padding:24px 20px;flex-direction:column;text-align:center;}
  .toc-inner{padding:0 4px;}
  .toc-link{padding:12px 14px;font-size:0.66rem;}
  .data-table{font-size:0.78rem;}
  .data-table th,.data-table td{padding:8px 10px;}
}
</style>
</head>
